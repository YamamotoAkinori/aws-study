AWSTemplateFormatVersion: 2010-09-09
Description: VPC with Subnet, Internet Gateway, Route Table, SecurityGroup, EC2Instance, RDS, MySQL, ALB example with target group and listener

Parameters:

  # RDSのパラメーター
  DBUsername:
    Description: RDSのマスターユーザー名
    Type: String
    Default: root
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]*"
  
  DBPassword:
    Description: RDSのマスターパスワード
    Type: String
    NoEcho: true
    Default: L2202670970
    MinLength: 8
    MaxLength: 41

Resources:

  # VPC
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: aws-study-vpc

  # サブネット：PublicSubnet
  # ap-northeast-1a
  MySubnetPublic1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.0.0/20
      AvailabilityZone: 
        Fn::Select:
        - 0
        - Fn::GetAZs: !Ref "AWS::Region"
      Tags:
        - Key: Name
          Value: aws-study-subnet-public1-ap-northeast-1a

  # ap-northeast-1c
  MySubnetPublic1c:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.16.0/20
      AvailabilityZone: 
        Fn::Select:
        - 0
        - Fn::GetAZs: !Ref "AWS::Region"
      Tags:
        - Key: Name
          Value: aws-study-subnet-public1-ap-northeast-1c

  MyInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: aws-study-igw

  AttachGatewayPublic:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref MyInternetGateway

  MyRouteTablePublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: aws-study-rtb-public

  DefaultRoute1:
    Type: AWS::EC2::Route
    DependsOn: AttachGatewayPublic
    Properties:
      RouteTableId: !Ref MyRouteTablePublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref MyInternetGateway

  # ap-northeast-1a
  SubnetRouteTableAssociationPublic1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref MySubnetPublic1a
      RouteTableId: !Ref MyRouteTablePublic

  # ap-northeast-1c
  SubnetRouteTableAssociationPublic1c:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref MySubnetPublic1c
      RouteTableId: !Ref MyRouteTablePublic

  # サブネット：PrivateSubnet
  # ap-northeast-1a
  MySubnetPrivate1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.128.0/20
      AvailabilityZone: 
        Fn::Select:
        - 0
        - Fn::GetAZs: !Ref "AWS::Region"
      Tags:
        - Key: Name
          Value: aws-study-subnet-private1-ap-northeast-1a

  # プライベートルートテーブル1a
  MyRouteTablePrivate1a:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: aws-study-rtb-private1-ap-northeast-1a

  DefaultRoute2:
    Type: AWS::EC2::Route
    DependsOn: AttachGatewayPublic
    Properties:
      RouteTableId: !Ref MyRouteTablePrivate1a
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref MyInternetGateway

  SubnetRouteTableAssociationPrivate1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref MySubnetPrivate1a
      RouteTableId: !Ref MyRouteTablePrivate1a

  # ap-northeast-1c
  MySubnetPrivate1c:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.144.0/20
      AvailabilityZone: 
        Fn::Select:
        - 0
        - Fn::GetAZs: !Ref "AWS::Region"
      Tags:
        - Key: Name
          Value: aws-study-subnet-private2-ap-northeast-1c

  # プライベートルートテーブル1c
  MyRouteTablePrivate1c:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: aws-study-rtb-private2-ap-northeast-1c

  SubnetRouteTableAssociationPrivate1c:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref MySubnetPrivate1c
      RouteTableId: !Ref MyRouteTablePrivate1c

  # EC2
  # セキュリティーグループ
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # EC2インスタンス
  MyEC2Instance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: ami-0c1638aa346a43fe8
      InstanceType: t2.micro
      KeyName: AkinoriYamamoto
      SubnetId: !Ref MySubnetPublic1a
      SecurityGroupIds:
        - !Ref MySecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sdm
          Ebs:
            VolumeType: gp3
            DeleteOnTermination: true
            VolumeSize: 20
      Tags:
        - Key: Name
          Value: aws-study-ec2
  
  # RDS
  MyDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: rds-ec2-db-subnet-group-3
      SubnetIds:
        - subnet-0cda5afac8ed25882
        - subnet-0edc3b2e4fdccadf4
        - subnet-03f40ea30192e51a0

  MyRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: my-rds-instance
      AllocatedStorage: 20
      DBInstanceClass: db.t4g.micro
      DBName: awsstudy
      Engine: mysql
      EngineVersion: 8.0.39
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      VPCSecurityGroups:
        - sg-00aa4e79a43aabe8e
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      StorageType: gp3

  MyRouteTableRDS:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: RDS-Pvt-rt

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP
      VpcId: vpc-03663fc8609d64170
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # ロードバランサー
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: aws-stack-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - subnet-09a2a6336ae92852d
        - subnet-096de6fee5db10af7
      SecurityGroups:
        - !Ref ALBSecurityGroup

  # ターゲットグループ
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: aws-stack-tg
      Port: 80
      Protocol: HTTP
      VpcId: vpc-03663fc8609d64170
      TargetType: instance
      HealthCheckPath: /
      HealthCheckProtocol: HTTP

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

# RDSの作成
Outputs:
  RDSInstanceEndpoint:
    Description: RDSのエンドポイント
    Value: !GetAtt MyRDSInstance.Endpoint.Address